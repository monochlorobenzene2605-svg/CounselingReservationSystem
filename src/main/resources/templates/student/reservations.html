<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>面談予約一覧</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", sans-serif;
			background-color: #f8fafc;
			color: #334155;
			padding: 24px;
			display: flex;
			justify-content: center;
		}

		.container {
			width: 100%;
			max-width: 680px;
		}

		/* 上部ヘッダー・アクションエリア */
		.header-actions {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 24px;
		}

		.btn-timeline {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			padding: 8px 16px;
			background-color: #2563eb;
			color: #ffffff;
			border: none;
			border-radius: 6px;
			font-size: 14px;
			font-weight: 600;
			cursor: pointer;
			text-decoration: none;
			transition: background-color 0.2s;
		}

		.btn-timeline:hover {
			background-color: #1d4ed8;
		}

		.btn-logout {
			padding: 8px 16px;
			background-color: #ffffff;
			color: #64748b;
			border: 1px solid #cbd5e1;
			border-radius: 6px;
			font-size: 14px;
			font-weight: 500;
			cursor: pointer;
			transition: all 0.2s;
		}

		.btn-logout:hover {
			background-color: #f1f5f9;
			color: #334155;
		}

		.page-title {
			text-align: center;
			font-size: 24px;
			font-weight: 700;
			color: #1e293b;
			margin-bottom: 24px;
		}

		/* カードデザイン */
		.card-list {
			display: flex;
			flex-direction: column;
			gap: 20px;
		}

		.card {
			background-color: #ffffff;
			border-radius: 16px;
			padding: 20px 24px;
			box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
			border: 1px solid #f1f5f9;
		}

		/* 日時ヘッダー */
		.card-header {
			display: flex;
			align-items: center;
			gap: 12px;
			margin-bottom: 16px;
		}

		.day-badge {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 28px;
			height: 28px;
			background-color: #e2e8f0;
			color: #334155;
			font-weight: 700;
			font-size: 14px;
			border-radius: 4px;
		}

		.datetime-text {
			font-size: 18px;
			font-weight: 700;
			color: #0f172a;
		}

		/* 情報ブロック領域 */
		.info-grid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 16px;
			margin-bottom: 16px;
		}

		@media (max-width: 560px) {
			.info-grid {
				grid-template-columns: 1fr;
			}
		}

		.info-box {
			border: 1px solid #475569;
			border-radius: 8px;
			padding: 12px 16px;
			background-color: #ffffff;
		}

		.box-title {
			font-size: 12px;
			color: #64748b;
			font-weight: 600;
			margin-bottom: 12px;
			display: flex;
			align-items: center;
			gap: 6px;
		}

		.box-title .icon {
			font-size: 14px;
		}

		/* 担当者コンテンツ */
		.interviewer-content {
			display: flex;
			align-items: center;
			gap: 12px;
			padding-top: 4px;
			padding-bottom: 8px;
		}

		.avatar {
			width: 44px;
			height: 44px;
			border-radius: 50%;
			border: 1.5px solid #334155;
			display: flex;
			align-items: center;
			justify-content: center;
			font-weight: 600;
			font-size: 16px;
			color: #0f172a;
			flex-shrink: 0;
		}

		.interviewer-name {
			font-size: 16px;
			font-weight: 700;
			color: #0f172a;
		}

		/* 詳細コンテンツ */
		.detail-heading {
			font-size: 15px;
			font-weight: 700;
			color: #0f172a;
			margin-bottom: 6px;
		}

		.detail-text {
			font-size: 12px;
			color: #64748b;
			line-height: 1.5;
		}

		/* 区切り線 */
		.divider {
			border: none;
			border-top: 1px dashed #e2e8f0;
			margin-bottom: 16px;
		}

		/* フッター・アクション */
		.card-footer {
			display: flex;
			justify-content: flex-end;
		}

		.btn-cancel {
			padding: 8px 20px;
			background-color: #ffffff;
			color: #ef4444;
			border: 1px solid #fca5a5;
			border-radius: 6px;
			font-size: 14px;
			font-weight: 700;
			cursor: pointer;
			transition: all 0.2s;
		}

		.btn-cancel:hover {
			background-color: #fef2f2;
			border-color: #f87171;
		}
	</style>
</head>

<body>

	<div class="container">
		<!-- ナビゲーション・アクションボタン -->
		<div class="header-actions">
			<button class="btn-timeline">📅 予約タイムライン画面へ</button>
			<button class="btn-logout">ログアウト</button>
		</div>

		<h1 class="page-title">面談予約一覧</h1>

		<div class="card-list">
			<!-- カード 1 -->
			<div class="card">
				<div class="card-header">
					<span class="day-badge">土</span>
					<span class="datetime-text">2026年8月15日(土) 14:00 〜 15:00</span>
				</div>

				<div class="info-grid">
					<!-- 担当者 -->
					<div class="info-box">
						<div class="box-title">
							<span class="icon">👤</span>
							<span>面談担当者</span>
						</div>
						<div class="interviewer-content">
							<div class="avatar">田</div>
							<span class="interviewer-name">田中 太郎</span>
						</div>
					</div>

					<!-- 内容 -->
					<div class="info-box">
						<div class="box-title">
							<span class="icon">📝</span>
							<span>面談内容</span>
						</div>
						<div class="detail-heading">履歴書・職務経歴書の添削</div>
						<p class="detail-text">一度書き直したものを改めて添削してほしいです。</p>
					</div>
				</div>

				<hr class="divider">

				<div class="card-footer">
					<button class="btn-cancel">予約を取り消す</button>
				</div>
			</div>

			<!-- カード 2 -->
			<div class="card">
				<div class="card-header">
					<span class="day-badge">月</span>
					<span class="datetime-text">2026年8月17日(月) 10:30 〜 11:00</span>
				</div>

				<div class="info-grid">
					<!-- 担当者 -->
					<div class="info-box">
						<div class="box-title">
							<span class="icon">👤</span>
							<span>面談担当者</span>
						</div>
						<div class="interviewer-content">
							<div class="avatar">佐</div>
							<span class="interviewer-name">佐藤 花子</span>
						</div>
					</div>

					<!-- 内容 -->
					<div class="info-box">
						<div class="box-title">
							<span class="icon">📝</span>
							<span>面談内容</span>
						</div>
						<div class="detail-heading">面接練習</div>
						<p class="detail-text">面接に向けて想定質問の洗い出しや練習をしたいです。</p>
					</div>
				</div>

				<hr class="divider">

				<div class="card-footer">
					<button class="btn-cancel">予約を取り消す</button>
				</div>
			</div>
		</div>
	</div>

</body>

</html>
