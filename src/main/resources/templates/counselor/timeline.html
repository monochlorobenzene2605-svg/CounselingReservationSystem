<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>予約状況タイムライン</title>
        <link
            th:href="@{/style/counselor/timeline.css}"
            href="../../static/style/counselor/timeline.css"
            rel="stylesheet"
        />
        <script
            th:src="@{/script/counselor/timeline.js}"
            src="../../static/script/counselor/timeline.js"
        ></script>
    </head>

    <body>
        <div class="container">
            <!-- 不可登録完了時 -->
            <div
                th:if="${param.status != null and #strings.equals(param.status, 'unavailableRegistered')}"
                class="success-message"
                id="unavailable-success-msg"
            >
                面談不可を設定しました。
            </div>
            <!-- 不可解除時 -->
            <div
                th:if="${param.status != null and #strings.equals(param.status, 'unavailableCanceled')}"
                class="cancel-message"
                id="unavailable-cancel-msg"
            >
                面談不可を解除しました。
            </div>
            <!-- エラー時 -->
            <div
                th:if="${param.status != null and #strings.equals(param.status, 'unavailableError')}"
                class="error-message"
                id="unavailable-error-msg"
            >
                更新処理に失敗しました。
            </div>
            <header class="header">
                <div class="header-title-area">
                    <h1>予約状況タイムライン</h1>
                </div>

                <div class="header-actions">
                    <div class="user-info">
                        <span
                            style="
                                color: #94a3b8;
                                font-weight: normal;
                                font-size: 0.75rem;
                            "
                            >ログイン:</span
                        >
                        <span th:text="${userName}">田中 太郎</span>
                    </div>
                    <div class="date-selector">
                        <form th:action="@{/counselor/timeline}" method="get">
                            <label
                                for="date-picker"
                                style="font-size: 0.9rem; font-weight: bold"
                                >対象日:</label
                            >
                            <input
                                type="date"
                                id="date-picker"
                                name="dateString"
                                th:value="${date}"
                                onchange="this.form.submit()"
                            />
                            <script>
                                // 今日～1か月後までの範囲しか選択できないようにする
                                const datePicker =
                                    document.getElementById("date-picker");
                                const today = new Date();
                                datePicker.min = today
                                    .toISOString()
                                    .split("T")[0];
                                const maxDate = new Date();
                                maxDate.setMonth(today.getMonth() + 1);
                                datePicker.max = maxDate
                                    .toISOString()
                                    .split("T")[0];
                            </script>
                        </form>
                    </div>
                    <form th:action="@{/logout}" method="post">
                        <button class="nav-btn btn-logout" type="submit">
                            ログアウト
                        </button>
                    </form>
                </div>

                <div class="legend">
                    <div class="legend-item">
                        <span class="legend-dot dot-available"></span> 受付中
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot dot-booked"></span> 予約あり
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot dot-unavailable"></span>
                        面談不可
                    </div>
                </div>
            </header>

            <main class="timeline-card">
                <table class="timeline-table">
                    <thead>
                        <tr>
                            <th class="counselor-col">相談員</th>
                            <th
                                th:each="slot : ${slotTemplates}"
                                th:text="${slot.startTime}"
                            >
                                09:00
                            </th>
                        </tr>
                    </thead>
                    <tbody id="timeline-body">
                        <tr>
                            <td class="counselor-col">
                                <div class="counselor-info">
                                    <div
                                        class="avatar"
                                        th:text="${timeline.counselorName.substring(0, 1)}"
                                    >
                                        田
                                    </div>
                                    <div>
                                        <div
                                            class="counselor-name"
                                            th:text="${timeline.counselorName}"
                                        >
                                            田中 太郎
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <span th:each="slot: ${timeline.slots}">
                                <td
                                    th:if="${slot.status == SlotStatus.Empty}"
                                    th:data-datetime="${#temporals.format(slot.startTime, 'yyyy/MM/dd HH:mm')}"
                                    th:data-counselor-name="${timeline.counselorName}"
                                    th:data-counselor-id="${timeline.counselorId}"
                                    class="slot-cell slot-available"
                                    onclick="handleRegisterUnavailable(event)"
                                >
                                    <!-- unavailable登録のための不可視のform -->
                                    <form
                                        th:action="@{/counselor/unavailable/register}"
                                        method="POST"
                                        class="unavailable-register"
                                    >
                                        <input
                                            class="date"
                                            type="hidden"
                                            name="dateTimeString"
                                            readonly
                                        />
                                    </form>
                                </td>
                                <td
                                    th:if="${slot.status == SlotStatus.Reserved}"
                                    th:data-reservation-id="${slot.reservationId}"
                                    th:data-datetime="${#temporals.format(slot.startTime, 'yyyy/MM/dd HH:mm')}"
                                    th:data-counselor-name="${timeline.counselorName}"
                                    th:data-student-name="${slot.studentName}"
                                    th:data-summary="${slot.summary}"
                                    th:data-detail="${slot.detail}"
                                    class="slot-cell slot-reserved"
                                    onClick="openReservationModal(event)"
                                ></td>
                                <td
                                    th:if="${slot.status == SlotStatus.Unavailabled}"
                                    th:data-datetime="${#temporals.format(slot.startTime, 'yyyy/MM/dd HH:mm')}"
                                    th:data-counselor-name="${timeline.counselorName}"
                                    th:data-counselor-id="${timeline.counselorId}"
                                    class="slot-cell slot-unavailable"
                                    onclick="handleCancelUnavailable(event)"
                                >
                                    <!-- unavailableキャンセルのための不可視のform -->
                                    <form
                                        th:action="@{/counselor/unavailable/cancel}"
                                        method="POST"
                                        class="unavailable-cancel"
                                    >
                                        <input
                                            class="date"
                                            type="hidden"
                                            name="dateTimeString"
                                            readonly
                                        />
                                    </form>
 </td>
                            </span>
                        </tr>
                    </tbody>
                </table>
            </main>
        </div>

        <!-- 予約詳細確認モーダル -->
        <div class="modal-overlay" id="reseevation-modal">
            <div class="modal">
                <div class="modal-header">
                    <div class="modal-title">予約詳細</div>
                    <span class="status-badge">予約確定</span>
                </div>
                <div class="form-group">
                    <label>担当相談員</label>
                    <div class="display-value" id="reseevation-counselor">
                        -
                    </div>
                </div>
                <div class="form-group">
                    <label>日時</label>
                    <div class="display-value" id="reseevation-datetime">-</div>
                </div>
                <div class="form-group">
                    <label>受講者名</label>
                    <div class="display-value" id="reseevation-student-name">
                        -
                    </div>
                </div>
                <div class="form-group">
                    <label>相談概要</label>
                    <div class="display-value" id="reseevation-summary">-</div>
                </div>
                <div class="form-group">
                    <label>相談詳細</label>
                    <div class="display-box" id="reseevation-detail">-</div>
                </div>
                <div class="modal-actions">
                    <button
                        type="button"
                        class="btn btn-cancel"
                        onclick="closeReservationModal()"
                    >
                        閉じる
                    </button>
                </div>
            </div>
        </div>
    </body>
</html>
