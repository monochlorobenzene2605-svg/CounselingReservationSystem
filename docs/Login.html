<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .login-box {
        background: #fff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        width: 320px;
    }

    .login-box h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    .input-group {
        margin-bottom: 15px;
    }

    .input-group label {
        display: block;
        margin-bottom: 5px;
    }

    .input-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
    }

    .login-btn {
        width: 100%;
        padding: 10px;
        background: #0078d4;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }

    .login-btn:hover {
        background: #005ea6;
    }
</style>
</head>
<body>

<div class="login-box">
    <h2>ログイン</h2>

    <div class="input-group">
        <label for="userid">ユーザーID</label>
        <input type="text" id="userid" placeholder="ユーザーIDを入力">
    </div>

    <div class="input-group">
        <label for="password">パスワード</label>
        <input type="password" id="password" placeholder="パスワードを入力">
    </div>

    <button class="login-btn">ログイン</button>
</div>

</body>
</html>
